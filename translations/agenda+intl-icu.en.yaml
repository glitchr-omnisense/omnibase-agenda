    title: "Google Calendar"
    lead: "The dates kept in a Google Calendar, from a phone: the site reads it every 30 minutes. Nobody needs to log in here to add a concert."
    address:
      title: "The calendar's secret address"
      label: "Secret address in iCal format"
      set: "A calendar is read"
      none: "No calendar yet"
      save: "Save"
      forget: "Forget this address"
      help: "It is the calendar's key: whoever has it reads the whole calendar. It is shown here half hidden; if it ever leaks, reset it in Google Calendar and paste the new one."
      configured: "Also read, set in the site's configuration:"
    sync:
      title: "Synchronisation"
      last: "Last read on {at}"
      created: "new"
      updated: "updated"
      cancelled: "cancelled"
      unchanged: "unchanged"
      never: "Not read yet"
      help: "The calendar is read and applied every 30 minutes. To see a change at once, read it now: what it would change is shown first, and applied only when you say so."
      now: "Read the calendar now"
      missing: "gone, waiting"
    howto:
      title: "How to"
      create: "In Google Calendar (on a computer, calendar.google.com), make a calendar for the concerts only: \"Other calendars\" › \"+\" › \"Create new calendar\", named \"Concerts\"."
      share: "If the agency keeps the dates too: the calendar's \"Settings and sharing\" › \"Share with specific people\" › its address, with \"Make changes to events\"."
      import: "Already dates on the site? Bring them into the new calendar first, so nothing is doubled: download the site's calendar, then in Google Calendar \"Settings\" › \"Import & export\" › \"Import\" it into \"Concerts\". Each date keeps its identity: the site recognises it when it reads it back."
      import_link: "Download the site's calendar (.ics)"
      secret: "In the same settings, \"Integrate calendar\" › \"Secret address in iCal format\": copy it."
      paste: "Paste it above and save. That is all: from now on the concerts are written in Google Calendar, on the phone or the computer."
      write: "A concert is an event of that calendar: the title is the concert's name, the location the hall and its address, the hours the concert's, and the description one piece of information per line - for example:"
    example:
      title: "Title: Perspectives concertantes — Glière"
      where: "Location: Elbphilharmonie, Platz der Deutschen Einheit 1, 20457 Hamburg"
      description_label: "Description:"
      description: |
        Orchestra: NDR Elbphilharmonie Orchester
        Conductor: Vasily Petrenko
        Role: soloist
        Tickets: https://www.elbphilharmonie.de/...
        Programme:
        Glière — Harp Concerto op. 74
        Debussy — Danses sacrée et profane
    copy: "Copy"
    copied: "Copied"
    copy_help: "Lines can be written in English, French, German or Italian, in any order; a line the site does not know is left aside."
    keys:
      title: "The words the site reads"
      ensemble: "Orchestra, ensemble"
      conductor: "Conductor"
      role: "Role"
      role_words: "soloist, concertmaster, chamber, orchestra, recital, masterclass"
      performers: "Performers"
      performers_help: "on the line, separated by commas (\"Anna Meyer, harp\"), or one per line under it"
      tickets: "Tickets"
      programme: "Programme"
      programme_help: "one work per line under it: \"Composer — Work\""
    after:
      title: "Then"
      edit: "A change in the calendar is on the site within 30 minutes."
      delete: "A concert deleted from the calendar is not cancelled on its own: it waits on this page until you say whether it is cancelled (struck through on the site, whoever had a ticket finds it) or kept."
      lock: "A date whose texts were rewritten on the site keeps them when \"Keep the site's texts\" is ticked on it (Agenda › Concerts): the calendar then only moves its hours and cancels it."
    preview:
      title: "What the calendar would change"
      nothing: "Nothing to change: the site already says what the calendar says ({count, plural, one {# date} other {# dates}} read)."
      lead: "Read just now, nothing applied yet: {created} new, {updated} updated, {cancelled} cancelled, {missing} gone from the calendar."
      apply: "Apply these changes"
      cancel: "Leave it"
      help: "The calendar is read again when you apply: a change made in it meanwhile is taken too. A date gone from the calendar is not cancelled: it waits below for your word."
    missing:
      title: "Gone from the calendar"
      lead: "{count, plural, one {This date is no longer in its calendar.} other {These # dates are no longer in their calendar.}} Deleted on purpose, or by a slip of the finger?"
      cancel: "Mark cancelled"
      keep: "Keep on the site"
      help: "Cancelled: struck through on the site, whoever had a ticket finds it. Kept: the date stays as it is and becomes the site's own - no calendar asks about it again."
      flash:
        cancelled: "{count, plural, =0 {No date cancelled.} one {# date marked cancelled.} other {# dates marked cancelled.}}"
        kept: "{count, plural, =0 {No date kept.} one {# date kept on the site.} other {# dates kept on the site.}}"
    history:
      title: "Last changes"
      counts: "{created} new, {updated} updated, {cancelled} cancelled, {missing} gone"
      more: "and {count} more"
    changes:
      created: "New"
      updated: "Updated"
      cancelled: "Cancelled"
      missing: "Gone"
      "yes": "yes"
      "no": "no"
    flash:
      saved: "Address saved: the calendar is read at the next sync."
      forgotten: "Address forgotten: that calendar is no longer read."
      invalid: "That is not an address: copy the whole \"Secret address in iCal format\" (https://calendar.google.com/…)."
      no_source: "No calendar to read: paste its address first."
