    after:
      title: "Danach"
      edit: "Eine Änderung im Kalender ist innerhalb von 30 Minuten auf der Website."
      delete: "Ein aus dem Kalender gelöschtes Konzert wird nicht von selbst abgesagt: es wartet auf dieser Seite, bis Sie sagen, ob es abgesagt (auf der Website durchgestrichen, wer eine Karte hat, findet es) oder behalten wird."
      lock: "Ein Termin, dessen Texte auf der Website neu geschrieben wurden, behält sie, wenn „Texte der Website behalten“ bei ihm angehakt ist (Termine › Konzerte): der Kalender verschiebt dann nur seine Zeiten und sagt ihn ab."
