      forget: "Diese Adresse vergessen"
      help: "Sie ist der Schlüssel des Kalenders: wer sie hat, liest den ganzen Kalender. Sie wird hier halb verdeckt gezeigt; sollte sie je bekannt werden, in Google Kalender zurücksetzen und die neue einfügen."
