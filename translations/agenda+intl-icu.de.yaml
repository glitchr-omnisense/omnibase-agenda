    sync:
      title: "Synchronisierung"
      last: "Zuletzt gelesen am {at}"
      created: "neu"
      updated: "aktualisiert"
      cancelled: "abgesagt"
      unchanged: "unverändert"
      never: "Noch nicht gelesen"
      help: "Der Kalender wird alle 30 Minuten gelesen und übernommen. Um eine Änderung sofort zu sehen, jetzt lesen: was er ändern würde, wird zuerst gezeigt und erst übernommen, wenn Sie es sagen."
      now: "Kalender jetzt lesen"
      missing: "verschwunden, wartend"
    howto:
      title: "So geht's"
      create: "In Google Kalender (am Computer, calendar.google.com) einen eigenen Kalender nur für die Konzerte anlegen: „Weitere Kalender“ › „+“ › „Neuen Kalender erstellen“, Name „Konzerte“."
      share: "Pflegt die Agentur die Termine mit: „Einstellungen und Freigabe“ des Kalenders › „Für bestimmte Personen freigeben“ › ihre Adresse, mit „Änderungen an Terminen vornehmen“."
      import: "Schon Termine auf der Website? Bringen Sie sie zuerst in den neuen Kalender, damit nichts doppelt ist: den Kalender der Website herunterladen, dann in Google Kalender „Einstellungen“ › „Importieren & exportieren“ › „Importieren“ in „Konzerte“. Jeder Termin behält seine Identität: die Website erkennt ihn beim Zurücklesen."
      import_link: "Kalender der Website herunterladen (.ics)"
      secret: "In denselben Einstellungen „Kalender integrieren“ › „Privatadresse im iCal-Format“: kopieren."
      paste: "Oben einfügen und speichern. Das ist alles: ab jetzt werden die Konzerte in Google Kalender eingetragen, am Handy oder am Computer."
      write: "Ein Konzert ist ein Termin dieses Kalenders: der Titel ist der Name des Konzerts, der Ort der Saal mit Adresse, die Zeiten die des Konzerts, und die Beschreibung eine Angabe pro Zeile - zum Beispiel:"
    example:
      title: "Titel: Perspectives concertantes — Glière"
      where: "Ort: Elbphilharmonie, Platz der Deutschen Einheit 1, 20457 Hamburg"
      description_label: "Beschreibung:"
      description: |
        Orchester: NDR Elbphilharmonie Orchester
        Dirigent: Vasily Petrenko
        Rolle: Solistin
        Karten: https://www.elbphilharmonie.de/...
        Programm:
        Glière — Harfenkonzert op. 74
        Debussy — Danses sacrée et profane
    copy: "Kopieren"
    copied: "Kopiert"
    copy_help: "Die Zeilen können auf Deutsch, Englisch, Französisch oder Italienisch geschrieben werden, in beliebiger Reihenfolge; eine Zeile, die die Website nicht kennt, bleibt außen vor."
    keys:
